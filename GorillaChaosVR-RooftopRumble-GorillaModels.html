<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gorilla Chaos VR: Nightmare</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050608;font-family:Arial,sans-serif}
#menu{position:fixed;z-index:5;left:12px;right:12px;top:12px;text-align:center;color:white;background:#111e;padding:12px;border:2px solid #6cff35;border-radius:14px}
button{font-size:16px;font-weight:bold;padding:12px;margin:4px;border:0;border-radius:9px}#multi{margin-top:8px;padding:8px;border:1px solid #6cff35;border-radius:10px}#multi input{width:26%;min-width:80px;padding:9px;margin:3px;border-radius:6px;border:0}
#vr{background:#6cff35;color:#071000}#horror{background:#b00025;color:white}#fly{background:#19c8ff;color:#00121a}
#status{font-size:13px}
</style>
</head>
<body>
<div id="menu">
<h2>🦍 GORILLA CHAOS VR</h2>
<div>Move by pushing your hands against the ground and surfaces. No portal gun.</div>
<button id="vr">ENTER VR</button>
<button id="horror">HORROR MODE: OFF</button>
<button id="rooftopMode">🏙️ ROOFTOP RUMBLE</button>
<div id="multi"><b>🌐 MULTIPLAYER</b><br>
<input id="playerName" maxlength="16" placeholder="Your name">
<input id="roomCode" maxlength="16" placeholder="Room code"><br>
<button id="hostRoom">CREATE ROOM</button><button id="joinRoom">JOIN ROOM</button>
<div id="multiStatus">Create a room, then share its code with a friend.</div>
</div>
<div id="status">Explore the forest. Watch for the monster.</div>
</div>
<script type="module">
window.addEventListener('error',e=>{const el=document.getElementById('status');if(el)el.textContent='Game error: '+(e.message||'unknown error');});
window.addEventListener('unhandledrejection',e=>{const el=document.getElementById('status');if(el)el.textContent='Game loading error: '+(e.reason?.message||e.reason||'unknown error');});
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';


const scene = new THREE.Scene();
const normalSky = new THREE.Color(0x87ceeb);
const darkSky = new THREE.Color(0x050008);
scene.background = normalSky.clone();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 150);
const player = new THREE.Group();
scene.add(player);
player.add(camera);
const localAvatar=makeGorillaAvatar(0x70c94b); localAvatar.root.position.set(0,-1.55,0); player.add(localAvatar.root); localAvatar.root.visible=false;
camera.position.set(0,1.6,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff,0x35402c,2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(5,12,5); scene.add(sun);

// Remade map: a forest hub with a glowing ONLY UP portal and a tall obstacle course.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x367b32}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.06; scene.add(ground);
for(let i=0;i<34;i++){
  const angle=(i/34)*Math.PI*2, radius=14+(i%4)*2.3;
  const x=Math.cos(angle)*radius,z=Math.sin(angle)*radius;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,3.2,7),new THREE.MeshStandardMaterial({color:0x624127}));
  trunk.position.set(x,1.6,z); scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.55,7,6),new THREE.MeshStandardMaterial({color:0x176c29}));
  leaves.position.set(x,3.6,z); scene.add(leaves);
}
// STAFF ROOM: an open, walk-in WebXR room beside the forest hub.
// The front wall has a wide gap, so players can walk straight inside.
const staffRoom = new THREE.Group();
scene.add(staffRoom);
const staffWall = new THREE.MeshStandardMaterial({color:0x242b35, roughness:.88});
const staffFloor = new THREE.MeshStandardMaterial({color:0x343b46, metalness:.18, roughness:.72});
const staffTrim = new THREE.MeshStandardMaterial({color:0x20e6b2, emissive:0x087d5e, emissiveIntensity:1.5});
const staffGlow = new THREE.MeshStandardMaterial({color:0x37ffd0, emissive:0x10c99a, emissiveIntensity:2.2});
const staffRoomCenter = new THREE.Vector3(-9,0,0);
function staffBox(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);staffRoom.add(m);return m;}
// Room footprint is x=-14..-4 and z=-7..3; front is z=3 with a 3-unit open doorway.
staffBox(10,.22,10,staffFloor,-9,.02,-2);
staffBox(10,3.6,.25,staffWall,-9,1.8,-7);
staffBox(.25,3.6,10,staffWall,-14,1.8,-2);
staffBox(.25,3.6,10,staffWall,-4,1.8,-2);
// Split front wall leaves a clear doorway in the middle.
staffBox(3.5,3.6,.25,staffWall,-12.25,1.8,3);
staffBox(3.5,3.6,.25,staffWall,-5.75,1.8,3);
// Neon doorway frame and a floating, readable sign.
staffBox(.12,3.3,.16,staffTrim,-10.55,1.7,2.82);
staffBox(.12,3.3,.16,staffTrim,-7.45,1.7,2.82);
staffBox(3.25,.12,.16,staffTrim,-9,3.32,2.82);
staffBox(4.8,.62,.18,staffWall,-9,3.9,2.8);
staffBox(4.45,.08,.08,staffGlow,-9,3.92,2.68);
function staffText(textValue, size, color){const c=document.createElement('canvas');c.width=512;c.height=128;const ctx=c.getContext('2d');ctx.clearRect(0,0,512,128);ctx.font='bold 54px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;ctx.fillText(textValue,256,64);const tex=new THREE.CanvasTexture(c);const mesh=new THREE.Mesh(new THREE.PlaneGeometry(size,size*.25),new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide}));mesh.position.set(-9,3.92,2.56);staffRoom.add(mesh);return mesh;}
staffText('STAFF ROOM',4.1,'#64ffe0');
// Desk, glowing monitors, control buttons and lockers.
staffBox(4.8,.22,1.25,staffWall,-9,.95,-4.7);
staffBox(.18,.95,.18,staffWall,-11.1,.48,-4.7);staffBox(.18,.95,.18,staffWall,-6.9,.48,-4.7);
const screenMat=new THREE.MeshStandardMaterial({color:0x071b22,emissive:0x00bfa5,emissiveIntensity:1.8});
for(let i=0;i<3;i++){staffBox(1.05,.72,.09,staffWall,-10.45+i*1.45,1.55,-5.1);staffBox(.88,.52,.035,screenMat,-10.45+i*1.45,1.56,-5.035);}
const buttonMats=[0xff334f,0xffc83d,0x38e7a2].map(color=>new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.6}));
for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.12,16),buttonMats[i]);b.position.set(-10.1+i*1.05,1.13,-3.95);staffRoom.add(b);}
for(let i=0;i<3;i++){staffBox(.85,2.25,.65,staffWall,-12.4+i*.95,1.15,-1.3);staffBox(.68,.08,.07,staffTrim,-12.4+i*.95,2.05,-.94);staffBox(.68,.08,.07,staffTrim,-12.4+i*.95,1.25,-.94);}
// Ceiling lamps and a cool pool of light make the room feel like a spooky control office.
for(const x of [-11,-7]){staffBox(1.2,.08,.45,staffGlow,x,3.48,-2);}
const staffLight=new THREE.PointLight(0x42ffd2,3.2,12);staffLight.position.set(-9,2.8,-2);staffRoom.add(staffLight);
const staffSign=document.createElement('div');staffSign.textContent='STAFF ROOM  •  walk through the glowing doorway';staffSign.style.cssText='position:fixed;left:50%;top:18%;transform:translateX(-50%);font:bold 18px Arial;color:#74ffe3;text-shadow:0 0 12px #00ffc3;pointer-events:none;z-index:2;display:none;text-align:center';document.body.appendChild(staffSign);

const portalGroup=new THREE.Group(); portalGroup.position.set(0,1.65,-6); scene.add(portalGroup);
const portalRing=new THREE.Mesh(new THREE.TorusGeometry(1.25,.16,12,36),new THREE.MeshStandardMaterial({color:0x9b35ff,emissive:0x7b18ff,emissiveIntensity:2.5,metalness:.25,roughness:.25})); portalGroup.add(portalRing);
const portalSurface=new THREE.Mesh(new THREE.CircleGeometry(1.12,32),new THREE.MeshBasicMaterial({color:0x4010a0,transparent:true,opacity:.62,side:THREE.DoubleSide})); portalGroup.add(portalSurface);
const portalLabel=document.createElement('div'); portalLabel.textContent='ONLY UP';
portalLabel.style.cssText='position:fixed;left:50%;top:28%;transform:translateX(-50%);font:bold 26px Arial;color:#e8c8ff;text-shadow:0 0 12px #a000ff;pointer-events:none;z-index:2;display:none;letter-spacing:3px'; document.body.appendChild(portalLabel);
const courseMat=new THREE.MeshStandardMaterial({color:0x7e52c9,roughness:.65});
const goldMat=new THREE.MeshStandardMaterial({color:0xffc94a,emissive:0x9a5b00,emissiveIntensity:.45});
function platform(x,y,z,w,d,mat=courseMat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,.45,d),mat);m.position.set(x,y,z);scene.add(m);return m;}
const courseStart={x:22,y:0,z:-24}; platform(22,.2,-24,5,5,goldMat);
const climb=[[22,1.8,-20,3,3],[25,3.5,-18,2.6,2.6],[28,5.2,-20,2.6,2.6],[28,7,-24,2.5,2.5],[25,8.8,-26,2.5,2.5],[21,10.6,-25,2.5,2.5],[18,12.4,-22,2.4,2.4],[18,14.2,-18,2.4,2.4],[21,16,-16,2.4,2.4],[25,17.8,-17,2.4,2.4],[28,19.6,-20,2.4,2.4],[27,21.4,-24,2.4,2.4],[23,23.2,-27,2.4,2.4],[19,25,-26,2.4,2.4],[16,26.8,-22,2.4,2.4],[17,28.6,-18,2.4,2.4],[21,30.4,-16,2.4,2.4],[25,32.2,-18,2.4,2.4],[27,34,-22,3,3]];
for(let i=0;i<climb.length;i++){const a=climb[i];platform(a[0],a[1],a[2],a[3],a[4],i===climb.length-1?goldMat:courseMat);}
for(const x of [14,30]){const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.18,.28,35,8),new THREE.MeshStandardMaterial({color:0x4d267d,emissive:0x25004b}));pillar.position.set(x,17.5,-22);scene.add(pillar);}
// Portal pair: bright orange and blue rings. The translucent apertures show a stylized view of the paired portal.
const portalMatA=new THREE.MeshStandardMaterial({color:0xff8b22,emissive:0xff4b00,emissiveIntensity:2.2,side:THREE.DoubleSide});
const portalMatB=new THREE.MeshStandardMaterial({color:0x22cfff,emissive:0x008cff,emissiveIntensity:2.2,side:THREE.DoubleSide});
const windowMatA=new THREE.MeshBasicMaterial({color:0x164e79,transparent:true,opacity:.78,side:THREE.DoubleSide});
const windowMatB=new THREE.MeshBasicMaterial({color:0x7a3a16,transparent:true,opacity:.78,side:THREE.DoubleSide});
function makePortal(ringMat,windowMat){const g=new THREE.Group();const ring=new THREE.Mesh(new THREE.TorusGeometry(.78,.12,12,32),ringMat);g.add(ring);const win=new THREE.Mesh(new THREE.CircleGeometry(.69,32),windowMat);g.add(win);g.visible=false;scene.add(g);return g;}
const portalA=makePortal(portalMatA,windowMatA), portalB=makePortal(portalMatB,windowMatB); portalA.visible=false; portalB.visible=false;
let portalPlaced=0;
function portalTravel(){
 if(!portalA.visible||!portalB.visible)return;
 const cam=new THREE.Vector3();camera.getWorldPosition(cam);
 for(const [from,to] of [[portalA,portalB],[portalB,portalA]]){
  const local=from.worldToLocal(cam.clone());
  if(Math.abs(local.x)<.72&&Math.abs(local.y)<.72&&Math.abs(local.z)<.42){
   const exit=to.localToWorld(new THREE.Vector3(local.x,local.y,.9));
   player.position.add(exit.sub(cam));velocity.set(0,0,0);status.textContent='🌀 Portal travel!';break;
  }
 }
}

// Controller groups and visible hand meshes. They live under the same player rig
// so locomotion uses controller LOCAL positions and avoids feedback teleporting.
const controllers=[], previousLocal=[null,null], handMeshes=[];
for(let i=0;i<2;i++){
 const c=renderer.xr.getController(i);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(.13,14,10),new THREE.MeshStandardMaterial({color:i===0?0xffb28a:0xff7545}));
 c.add(hand); handMeshes.push(hand); player.add(c); controllers.push(c);

}

// Lightweight WebRTC multiplayer using PeerJS. One player creates a room;
// friends enter the same room code to connect through the PeerJS signaling service.
const multiStatus=document.getElementById('multiStatus');
let peer=null, isRoomHost=false;
const connections=new Set(), remotePlayers=new Map();
const playerNameInput=document.getElementById('playerName');
const roomCodeInput=document.getElementById('roomCode');
playerNameInput.value='Player'+Math.floor(100+Math.random()*900);
function safeRoomCode(){return (roomCodeInput.value||'CHAOS').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,16)||'CHAOS';}
function makeRemoteAvatar(name){
 const avatar=makeGorillaAvatar(0x7cff38),group=avatar.root;
 const labelCanvas=document.createElement('canvas');labelCanvas.width=256;labelCanvas.height=64;
 const ctx=labelCanvas.getContext('2d');ctx.fillStyle='#000000aa';ctx.fillRect(0,0,256,64);
 ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText(String(name||'Player').slice(0,16),128,42);
 const texture=new THREE.CanvasTexture(labelCanvas);
 const label=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 label.scale.set(1.3,.33,1);label.position.y=2.08;group.add(label);
 scene.add(group);return {group,hands:avatar.parts.hands,arms:avatar.parts.arms};
}
function removeRemote(id){const r=remotePlayers.get(id);if(r){scene.remove(r.group);r.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});remotePlayers.delete(id);}}
function handleData(conn,data){
 if(!data||typeof data!=='object')return;
 if(data.type==='rumbleHit' && rooftopActive){const target=rooftopFighters.find(f=>f.name===data.target);if(target)rumbleHit(target);return;}
 if(data.type==='hello'){conn._remoteName=String(data.name||'Player').slice(0,16);return;}
 if(data.type==='state'){
   let r=remotePlayers.get(conn.peer);
   if(!r){r=makeRemoteAvatar(data.name||conn._remoteName||'Player');remotePlayers.set(conn.peer,r);}
   const p=data.p;
   if(p&&[p.x,p.y,p.z,p.yaw].every(Number.isFinite)){
     r.group.position.set(p.x,p.y,p.z);r.group.rotation.y=p.yaw;
     r.group.visible=true;
   }
   if(Array.isArray(data.hands))data.hands.forEach((h,i)=>{if(i<2&&h&&[h.x,h.y,h.z].every(Number.isFinite)){r.hands[i].position.set(h.x-p.x,h.y-p.y,h.z-p.z);}});
 }
}
function attachConnection(conn){
 connections.add(conn);
 conn.on('open',()=>{conn.send({type:'hello',name:playerNameInput.value||'Player'});multiStatus.textContent='Connected! Share room code: '+safeRoomCode();});
 conn.on('data',data=>handleData(conn,data));
 conn.on('close',()=>{connections.delete(conn);removeRemote(conn.peer);multiStatus.textContent='A player disconnected.';});
 conn.on('error',e=>{multiStatus.textContent='Connection error: '+e.message;});
}
async function startPeer(host){
 let PeerClass;
 try { const peerModule = await import('https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm'); PeerClass = peerModule.default; }
 catch(e) { multiStatus.textContent='Multiplayer library failed to load. The game should still work; reload and try again.'; return; }
 if(peer){try{peer.destroy();}catch(e){}}
 connections.clear();remotePlayers.forEach((_,id)=>removeRemote(id));
 const code=safeRoomCode();
 isRoomHost=host;
 const peerId='gorillachaosvr-'+code.toLowerCase();
 multiStatus.textContent=host?'Creating room '+code+'…':'Connecting to room '+code+'…';
 try{
  peer=host?new PeerClass(peerId):new PeerClass();
  peer.on('open',id=>{
   if(host){multiStatus.textContent='ROOM OPEN: '+code+' — tell friends to enter this code.';}
   else{
    const conn=peer.connect(peerId,{reliable:true});
    attachConnection(conn);
    setTimeout(()=>{if(!conn.open)multiStatus.textContent='Still connecting… check the room code and make sure the host created the room.';},5000);
   }
  });
  peer.on('connection',conn=>attachConnection(conn));
  peer.on('error',e=>{
   const msg=String(e.type||e.message||e);
   multiStatus.textContent=(msg.includes('unavailable-id')?'That room code is already in use. Try another.':msg.includes('peer-unavailable')?'Room not found. Ask the host to create it first.':'Multiplayer error: '+msg);
  });
 }catch(e){multiStatus.textContent='Could not start multiplayer: '+e.message;}
}
document.getElementById('hostRoom').addEventListener('click',()=>startPeer(true));
document.getElementById('joinRoom').addEventListener('click',()=>startPeer(false));
function sendMultiplayerState(){
 if(!peer||peer.destroyed)return;
 const head=new THREE.Vector3();camera.getWorldPosition(head);
 const yaw=new THREE.Euler().setFromQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()),'YXZ').y;
 const hands=controllers.map(c=>{const v=new THREE.Vector3();c.getWorldPosition(v);return {x:v.x,y:v.y,z:v.z};});
 const data={type:'state',name:(playerNameInput.value||'Player').slice(0,16),p:{x:player.position.x,y:player.position.y,z:player.position.z,yaw},head:{x:head.x,y:head.y,z:head.z},hands};
 connections.forEach(c=>{if(c.open)try{c.send(data);}catch(e){}});
}



// ROOFTOP RUMBLE: local combat, three sparring AI, knockdowns and grab/throw.
let rooftopActive=false, rooftopArena=null, rooftopFighters=[], grabbedFighter=null;
let rooftopHud=null, rooftopLastHit=[0,0];

function makeGorillaAvatar(color=0x70c94b,withName=''){
 const root=new THREE.Group();
 const fur=new THREE.MeshStandardMaterial({color,roughness:.9,flatShading:true});
 const face=new THREE.MeshStandardMaterial({color:0x302a2a,roughness:1,flatShading:true});
 const muzzle=new THREE.MeshStandardMaterial({color:0x8b7770,roughness:1,flatShading:true});
 const eye=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5});
 const pupil=new THREE.MeshStandardMaterial({color:0x151515,roughness:.4});
 const parts={arms:[],legs:[],hands:[],feet:[],head:null,torso:null};
 function ball(parent,geo,mat,pos){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);parent.add(m);return m;}
 // Broad, slightly tapered body and hunched shoulders.
 parts.torso=ball(root,new THREE.CapsuleGeometry(.36,.52,4,7),fur,[0,.92,0]);
 ball(root,new THREE.SphereGeometry(.43,10,8),fur,[0,1.28,0]);
 // Head with dark face patch, muzzle, ears and eyes.
 const head=new THREE.Group();head.position.set(0,1.62,.015);root.add(head);parts.head=head;
 ball(head,new THREE.SphereGeometry(.29,10,8),fur,[0,0,0]);
 ball(head,new THREE.SphereGeometry(.205,10,8),face,[0,-.045,.235]);
 ball(head,new THREE.SphereGeometry(.13,9,7),muzzle,[0,-.13,.34]);
 for(const side of [-1,1]){
  ball(head,new THREE.SphereGeometry(.065,8,6),fur,[side*.29,.02,0]);
  ball(head,new THREE.SphereGeometry(.045,8,6),eye,[side*.105,.045,.39]);
  ball(head,new THREE.SphereGeometry(.022,8,6),pupil,[side*.105,.045,.428]);
  // Long gorilla-like arms, pivoted at the shoulders.
  const arm=new THREE.Group();arm.position.set(side*.39,1.27,0);root.add(arm);
  ball(arm,new THREE.CapsuleGeometry(.13,.48,4,7),fur,[side*.08,-.34,.04]);
  const hand=ball(arm,new THREE.SphereGeometry(.17,9,7),fur,[side*.1,-.68,.1]);
  parts.arms.push(arm);parts.hands.push(hand);
  // Short legs with broad feet.
  const leg=new THREE.Group();leg.position.set(side*.19,.56,0);root.add(leg);
  ball(leg,new THREE.CapsuleGeometry(.14,.30,4,7),fur,[0,-.2,0]);
  const foot=ball(leg,new THREE.SphereGeometry(.18,9,7),fur,[0,-.39,.1]);
  parts.legs.push(leg);parts.feet.push(foot);
 }
 return {root,parts};
}

function makeFighter(name,color,x,z,isAI=true){
 const avatar=makeGorillaAvatar(color),g=avatar.root;
 g.position.set(x,.12,z);scene.add(g);
 const f={name,group:g,arms:avatar.parts.arms,legs:avatar.parts.legs,avatarParts:avatar.parts,
 hits:0,downUntil:0,grabbed:false,isAI,aiThink:0,walk:Math.random()*5,
 throwVel:new THREE.Vector3(),alive:true,ragdollUntil:0,hitCooldown:0};
 rooftopFighters.push(f);return f;
}
function buildRooftop(){
 if(rooftopArena)return;
 rooftopArena=new THREE.Group();scene.add(rooftopArena);
 const concrete=new THREE.MeshStandardMaterial({color:0x454a54,roughness:.95});
 const edge=new THREE.MeshStandardMaterial({color:0x252a33});
 const roof=new THREE.Mesh(new THREE.BoxGeometry(22,.65,22),concrete);roof.position.set(0,-.38,0);rooftopArena.add(roof);
 for(const [x,z,w,d] of [[0,-11,22,.5],[0,11,22,.5],[-11,0,.5,22],[11,0,.5,22]]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(w,1.2,d),edge);rail.position.set(x,.45,z);rooftopArena.add(rail);
 }
 // Low parapet gaps at the four corners let fighters be thrown off.
 for(const [x,z] of [[-9.8,-9.8],[9.8,-9.8],[-9.8,9.8],[9.8,9.8]]){
  const crate=new THREE.Mesh(new THREE.BoxGeometry(1.5,.8,1.5),new THREE.MeshStandardMaterial({color:0x9b6739}));crate.position.set(x,.3,z);rooftopArena.add(crate);
 }
 const skylineMat=new THREE.MeshStandardMaterial({color:0x202c3e,roughness:1});
 for(let i=0;i<12;i++){const h=3+(i*7%9);const b=new THREE.Mesh(new THREE.BoxGeometry(3,h,3),skylineMat);b.position.set((i%4-1.5)*9,h/2-1.2,-18-Math.floor(i/4)*5);rooftopArena.add(b);}
}
function startRooftop(){
 buildRooftop();rooftopActive=true;horror=false;monster.visible=false;
 rooftopFighters.forEach(f=>{scene.remove(f.group);});rooftopFighters=[];
 player.position.set(0,0,7);velocity.set(0,0,0);previousLocal.forEach(v=>{if(v)v.set(0,0,0);});
 makeFighter('BOT 1',0xff6b45,-4,-3);makeFighter('BOT 2',0x44b9ff,0,-4);makeFighter('BOT 3',0xffd447,4,-3);
 status.textContent='ROOFTOP RUMBLE: punch bots 5 times, then grab and throw them off the roof!';
 document.getElementById('rooftopMode').textContent='LEAVE ROOFTOP RUMBLE';
 if(!rooftopHud){rooftopHud=document.createElement('div');rooftopHud.style.cssText='position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#111d;color:white;border:1px solid #f80;border-radius:10px;font: bold 15px Arial;z-index:5;text-align:center;pointer-events:none';document.body.appendChild(rooftopHud);}
 rooftopHud.style.display='block';rooftopHud.textContent='ROOFTOP RUMBLE • 5 HITS = KNOCKDOWN • GRIP TO GRAB';
}
function stopRooftop(){
 rooftopActive=false;rooftopFighters.forEach(f=>scene.remove(f.group));rooftopFighters=[];
 if(rooftopHud)rooftopHud.style.display='none';
 player.position.set(0,0,0);velocity.set(0,0,0);
 status.textContent='Back to the forest lobby.';
 document.getElementById('rooftopMode').textContent='🏙️ ROOFTOP RUMBLE';
}
document.getElementById('rooftopMode').addEventListener('click',()=>rooftopActive?stopRooftop():startRooftop());
function sendRumbleHit(target){
 if(!peer)return;
 connections.forEach(c=>{if(c.open)try{c.send({type:'rumbleHit',target,hitter:playerNameInput.value||'Player'});}catch(e){}});
}
function setRagdoll(f,until){
 f.downUntil=until;f.ragdollUntil=until;f.group.rotation.z=(Math.random()-.5)*.28;
 f.group.rotation.x=(Math.random()-.5)*.35;
 f.avatarParts.arms.forEach((a,i)=>{a.rotation.x=(i===0?-1:1)*1.45;a.rotation.z=(i===0?1:-1)*1.05;});
 f.avatarParts.legs.forEach((l,i)=>{l.rotation.x=(i===0?-.9:.9);l.rotation.z=(i===0?-.3:.3);});
}
function recoverFighter(f){
 f.group.rotation.set(0,0,0);
 f.avatarParts.arms.forEach(a=>a.rotation.set(0,0,0));
 f.avatarParts.legs.forEach(l=>l.rotation.set(0,0,0));
}
function rumbleHit(f){
 if(!f||!f.alive||performance.now()<f.downUntil)return;
 f.hits++;
 if(f.hits>=5){f.hits=0;setRagdoll(f,performance.now()+6000);}
}
function updateRooftop(dt){
 if(!rooftopActive)return;
 const now=performance.now(), cam=new THREE.Vector3();camera.getWorldPosition(cam);
 // Hand contacts count as punches; use a short cooldown per hand.
 controllers.forEach((c,i)=>{
  const hand=new THREE.Vector3();c.getWorldPosition(hand);
  if(now-rooftopLastHit[i]>330){
   for(const f of rooftopFighters){
    if(!f.alive||f.grabbed||now<f.downUntil)continue;
    if(hand.distanceTo(f.group.position.clone().add(new THREE.Vector3(0,1,0)))<.62){
      rumbleHit(f);rooftopLastHit[i]=now;break;
    }
   }
  }
 });
 // Grip grabs a knocked-down bot; releasing grip throws it.
 controllers.forEach((c,i)=>{
  const gamepad=renderer.xr.getSession()?.inputSources?.[i]?.gamepad;
  const grip=gamepad?.buttons?.[1]?.pressed;
  if(grip&&!grabbedFighter){
   const h=new THREE.Vector3();c.getWorldPosition(h);
   const f=rooftopFighters.find(v=>v.alive&&now<v.downUntil&&v.group.position.distanceTo(h)<1.35);
   if(f){grabbedFighter=f;f.grabbed=true;}
  }else if(!grip&&grabbedFighter){
   const f=grabbedFighter;f.grabbed=false;f.downUntil=now+6000;setRagdoll(f,now+6000);
   const dir=new THREE.Vector3();c.getWorldDirection(dir);f.throwVel.copy(dir).multiplyScalar(9);f.throwVel.y=4;f.group.rotation.x+=.25;grabbedFighter=null;
  }
 });
 for(const f of rooftopFighters){
  if(!f.alive)continue;
  if(f.grabbed){
   const c=controllers[1]||controllers[0],h=new THREE.Vector3();c.getWorldPosition(h);
   f.group.position.copy(h).add(new THREE.Vector3(0,-.65,-.15));continue;
  }
  if(now<f.downUntil){f.group.position.addScaledVector(f.throwVel,dt);f.throwVel.y-=9.8*dt;}
  else{
   if(f.ragdollUntil){f.ragdollUntil=0;recoverFighter(f);}
   const dx=cam.x-f.group.position.x,dz=cam.z-f.group.position.z,dist=Math.hypot(dx,dz);
   if(dist>.9){f.group.position.x+=dx/dist*1.05*dt;f.group.position.z+=dz/dist*1.05*dt;}
   f.walk+=dt*6;f.arms.forEach((a,i)=>a.rotation.x=Math.sin(f.walk+i*Math.PI)*.45);
   if(dist<1.25&&Math.random()<dt*.65){rumbleHit({ ...f, hits:4 });f.downUntil=now+6000;setRagdoll(f,now+6000);}
  }
  if(Math.abs(f.group.position.x)>12||Math.abs(f.group.position.z)>12||f.group.position.y< -4){f.alive=false;scene.remove(f.group);}
 }
 const alive=rooftopFighters.filter(f=>f.alive).length;
 if(rooftopHud)rooftopHud.textContent='ROOFTOP RUMBLE • Bots left: '+alive+' • Punch 5x • Hold grip to grab, release to throw';
 if(alive===0&&rooftopFighters.length){status.textContent='🏆 YOU WIN! All rooftop bots eliminated!';}
}

// Push movement: measure controller LOCAL motion, not world motion.
// This avoids counting the player's own rig movement as hand movement.
function updateMovement(dt){
 for(let i=0;i<controllers.length;i++){
   const c=controllers[i], p=c.position;
   if(previousLocal[i]){
     const dx=p.x-previousLocal[i].x;
     const dy=p.y-previousLocal[i].y;
     const dz=p.z-previousLocal[i].z;
     const nearFloor=p.y<0.72;
     const handSpeed=Math.sqrt(dx*dx+dy*dy+dz*dz);
     if(nearFloor && handSpeed<0.24 && handSpeed>0.012){
       player.position.x-=dx*2.0;
       player.position.z-=dz*2.0;
       // Small, controlled upward impulse only for a deliberate downward push.
       if(dy < -0.025) velocity.y=Math.min(velocity.y+Math.abs(dy)*5.0,3.2);
     }
   }
   if(!previousLocal[i]) previousLocal[i]=new THREE.Vector3();
   previousLocal[i].copy(p);
 }
 velocity.y-=9.8*dt;
 player.position.y+=velocity.y*dt;
 if(player.position.y<0){player.position.y=0;velocity.y=0;}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-45,45);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-45,45);
}

let portalCooldown=0, inOnlyUp=false;
function checkPortal(dt){
 portalCooldown=Math.max(0,portalCooldown-dt);
 const camPos=new THREE.Vector3();camera.getWorldPosition(camPos);
 const nearPortal=Math.hypot(camPos.x-portalGroup.position.x,camPos.z-portalGroup.position.z)<1.65 && Math.abs(camPos.y-portalGroup.position.y)<1.8;
 const nearStaff=camPos.x>-12.8 && camPos.x<-5.2 && camPos.z>1.2 && camPos.z<5.2;
 staffSign.style.display=nearStaff?'block':'none';
 portalLabel.style.display=nearPortal?'block':'none';
 if(nearPortal && portalCooldown===0 && !inOnlyUp){
   player.position.set(courseStart.x,courseStart.y,courseStart.z); velocity.set(0,0,0);
   previousLocal.forEach(v=>{if(v)v.set(0,0,0);}); inOnlyUp=true;portalCooldown=1.4;
   status.textContent='🚀 ONLY UP! Climb the floating platforms. Falling sends you back to the start.';
 } else if(inOnlyUp && camPos.y < -2 && portalCooldown===0){
   player.position.set(courseStart.x,0,courseStart.z);velocity.set(0,0,0);portalCooldown=1.4;
   status.textContent='Back to the start — try the climb again!';
 }
}
function updateMonster(dt){
 if(!horror||caught)return;
 const camPos=new THREE.Vector3();camera.getWorldPosition(camPos);
 const mPos=monster.position;
 const dx=camPos.x-mPos.x,dz=camPos.z-mPos.z;
 const dist=Math.hypot(dx,dz);
 if(dist>0.001){mPos.x+=(dx/dist)*1.15*dt;mPos.z+=(dz/dist)*1.15*dt;}
 monster.position.y=camPos.y-0.55;
 monster.lookAt(camPos.x,camPos.y,camPos.z);
 if(dist<1.15){
   caught=true;status.textContent='💀 THE MONSTER CAUGHT YOU! Turn Horror Mode off to restart.';
 }
}

document.getElementById('vr').addEventListener('click',async()=>{
 try{
   if(!navigator.xr){alert('WebXR is not available. Open this page in the Meta Quest Browser.');return;}
   const ok=await navigator.xr.isSessionSupported('immersive-vr');
   if(!ok){alert('VR mode is not supported by this browser session.');return;}
   const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
   await renderer.xr.setSession(session);
   document.getElementById('menu').style.display='none';
 }catch(e){alert('Could not enter VR: '+e.message);}
});

renderer.setAnimationLoop(()=>{
 const now=performance.now(),dt=Math.min((now-last)/1000,.035);last=now;
 updateMovement(dt);checkPortal(dt);portalTravel();updateMonster(dt);updateRooftop(dt);
 if(Math.floor(now/80)!==Math.floor((now-dt*1000)/80))sendMultiplayerState();
 renderer.render(scene,camera);
});
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
</script>
