<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>Gorilla Chaos VR: NIGHTMARE</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }

  #menu {
    position: fixed;
    z-index: 10;
    top: 12px;
    left: 12px;
    right: 12px;
    padding: 15px;
    color: white;
    background: #101010e8;
    border: 2px solid #39ff14;
    border-radius: 14px;
    text-align: center;
  }

  button {
    padding: 12px 18px;
    margin: 5px;
    font-size: 16px;
    font-weight: bold;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }

  #vrButton {
    background: #39ff14;
  }

  #horrorButton {
    background: #c00020;
    color: white;
  }

  #message {
    font-size: 14px;
    margin-top: 8px;
  }
</style>
</head>

<body>
<div id="menu">
  <h2>🦍 GORILLA CHAOS VR</h2>
  <p>Explore the forest. Whatever you do, don't let it catch you.</p>
  <button id="vrButton">🥽 ENTER VR</button>
  <button id="horrorButton">👹 HORROR MODE: OFF</button>
  <div id="message">Find a way to survive.</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ---------------- SETUP ----------------

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.05, 150
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;

document.body.appendChild(renderer.domElement);

const rig = new THREE.Group();
scene.add(rig);
rig.add(camera);
camera.position.set(0, 1.6, 0);

// ---------------- LIGHTING ----------------

const skyLight = new THREE.HemisphereLight(
  0xffffff, 0x405040, 2
);
scene.add(skyLight);

const sunlight = new THREE.DirectionalLight(0xffffff, 1.5);
sunlight.position.set(5, 12, 5);
scene.add(sunlight);

// ---------------- FOREST ----------------

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x367b32 })
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
scene.add(ground);

// Trees
for (let i = 0; i < 45; i++) {
  const x = (Math.random() - 0.5) * 65;
  const z = (Math.random() - 0.5) * 65;

  if (Math.abs(x) < 3 && Math.abs(z) < 5) continue;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.35, 3, 7),
    new THREE.MeshStandardMaterial({ color: 0x624127 })
  );

  trunk.position.set(x, 1.5, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.5, 7, 6),
    new THREE.MeshStandardMaterial({ color: 0x176c29 })
  );

  leaves.position.set(x, 3.5, z);
  scene.add(leaves);
}

// ---------------- PLATFORMS ----------------

for (let i = 0; i < 8; i++) {
  const platform = new THREE.Mesh(
    new THREE.BoxGeometry(3, 0.4, 3),
    new THREE.MeshStandardMaterial({ color: 0x93643c })
  );

  platform.position.set(
    (i % 4) * 4 - 6,
    1 + Math.floor(i / 4) * 1.5,
    -8
  );

  scene.add(platform);
}

// ---------------- CONTROLLER HANDS ----------------

const controllers = [];
const previousHands = [];
const handWorldPositions = [];

for (let i = 0; i < 2; i++) {
  const controller = renderer.xr.getController(i);

  const hand = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 12, 10),
    new THREE.MeshStandardMaterial({
      color: i === 0 ? 0xffb28a : 0xff7545
    })
  );

  hand.position.set(0, 0, 0);
  controller.add(hand);
  rig.add(controller);

  controllers.push(controller);
  previousHands.push(new THREE.Vector3());
  handWorldPositions.push(new THREE.Vector3());
}

// ---------------- MONSTER ----------------

// Upload your image to the repository as monster.jpg.
const textureLoader = new THREE.TextureLoader();

const monsterMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  side: THREE.DoubleSide,
  transparent: false
});

const monster = new THREE.Mesh(
  new THREE.PlaneGeometry(1.8, 2.4),
  monsterMaterial
);

monster.visible = false;
scene.add(monster);

textureLoader.load(
  './monster.jpg',
  texture => {
    monsterMaterial.map = texture;
    monsterMaterial.needsUpdate = true;
  },
  undefined,
  () => {
    document.getElementById('message').textContent =
      'Monster picture missing! Upload monster.jpg to GitHub.';
  }
);

// ---------------- HORROR MODE ----------------

let horrorMode = false;
let gameOver = false;
let monsterDistance = 18;
let scareTimer = 0;

const normalBackground = new THREE.Color(0x87ceeb);
const horrorBackground = new THREE.Color(0x050008);

document.getElementById('horrorButton').onclick = () => {
  horrorMode = !horrorMode;

  gameOver = false;
  monsterDistance = 18;

  scene.background.copy(
    horrorMode ? horrorBackground : normalBackground
  );

  scene.fog = horrorMode
    ? new THREE.Fog(0x090009, 2, 25)
    : null;

  skyLight.intensity = horrorMode ? 0.2 : 2;
  sunlight.intensity = horrorMode ? 0.05 : 1.5;

  monster.visible = horrorMode;

  document.getElementById('horrorButton').textContent =
    horrorMode ? '😈 HORROR MODE: ON' : '👹 HORROR MODE: OFF';

  document.getElementById('message').textContent =
    horrorMode
      ? 'RUN. IT KNOWS WHERE YOU ARE.'
      : 'The forest seems safe... for now.';
};

// ---------------- MOVEMENT ----------------

const playerVelocity = new THREE.Vector3();
const direction = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();

let lastTime = performance.now();

function updateMovement(dt) {
  const cameraWorld = new THREE.Vector3();
  camera.getWorldPosition(cameraWorld);

  camera.getWorldDirection(forward);
  forward.y = 0;

  if (forward.lengthSq() > 0.001) forward.normalize();

  right.set(forward.z, 0, -forward.x);

  // Approximate Gorilla Tag-style pushing:
  // moving a controller down near the floor pushes the player upward;
  // moving it while touching the floor pushes the player horizontally.
  for (let i = 0; i < controllers.length; i++) {
    controllers[i].getWorldPosition(handWorldPositions[i]);

    const handPos = handWorldPositions[i];
    const previous = previousHands[i];

    if (previous.lengthSq() > 0) {
      const movement = handPos.clone().sub(previous);
      const nearGround = handPos.y < 0.65;

      if (nearGround && movement.length() > 0.015) {
        rig.position.x -= movement.x * 1.8;
        rig.position.z -= movement.z * 1.8;

        if (movement.y < -0.025) {
          playerVelocity.y = Math.min(
            playerVelocity.y + Math.abs(movement.y) * 5,
            4.5
          );
        }
      }
    }

    previous.copy(handPos);
  }

  // Gravity and jumping
  playerVelocity.y -= 9.8 * dt;
  rig.position.y += playerVelocity.y * dt;

  if (rig.position.y < 0) {
    rig.position.y = 0;
    playerVelocity.y = 0;
  }

  // Keep the player inside the map
  rig.position.x = THREE.MathUtils.clamp(
    rig.position.x, -45, 45
  );

  rig.position.z = THREE.MathUtils.clamp(
    rig.position.z, -45, 45
  );
}

// ---------------- MONSTER AI ----------------

function updateMonster(dt) {
  if (!horrorMode || gameOver) return;

  const playerPosition = new THREE.Vector3();
  camera.getWorldPosition(playerPosition);

  const toPlayer = playerPosition.clone().sub(monster.position);
  const distance = toPlayer.length();

  scareTimer += dt;

  // The monster chases the player.
  if (distance > 0.001) {
    toPlayer.normalize();

    const speed = 1.5;

    monster.position.addScaledVector(
      toPlayer, speed * dt
    );
  }

  // Always face the player
  monster.lookAt(playerPosition.x, monster.position.y,
                 playerPosition.z);

  // Appear ahead of the player when horror mode starts.
  if (monsterDistance > 0) {
    const cameraDirection = new THREE.Vector3();
    camera.getWorldDirection(cameraDirection);

    monster.position.copy(playerPosition)
      .addScaledVector(cameraDirection, monsterDistance);

    monster.position.y = playerPosition.y;
    monsterDistance = 0;
  }

  if (distance < 1.2) {
    gameOver = true;

    document.getElementById('message').textContent =
      '💀 IT CAUGHT YOU! Turn Horror Mode off to try again.';

    monster.scale.set(1.8, 1.8, 1.8);
  }
}

// ---------------- VR BUTTON ----------------

document.getElementById('vrButton').onclick = async () => {
  try {
    if (!navigator.xr) {
      alert('WebXR is unavailable. Open the game in the Quest browser.');
      return;
    }

    const supported =
      await navigator.xr.isSessionSupported('immersive-vr');

    if (!supported) {
      alert('VR is not supported in this browser session.');
      return;
    }

    const session = await navigator.xr.requestSession(
      'immersive-vr',
      { optionalFeatures: ['local-floor'] }
    );

    await renderer.xr.setSession(session);

    document.getElementById('menu').style.display = 'none';
  } catch (error) {
    alert('Could not enter VR: ' + error.message);
  }
};

// ---------------- GAME LOOP ----------------

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.04);
  lastTime = now;

  updateMovement(dt);
  updateMonster(dt);

  renderer.render(scene, camera);
});

// ---------------- RESIZE ----------------

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
